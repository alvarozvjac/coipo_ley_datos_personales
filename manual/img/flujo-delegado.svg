<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-label="Flujo del Delegado de protección de datos">
<title>Flujo del Delegado de protección de datos</title>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b4a42"/></marker></defs>
<style>.tx{font:12px sans-serif;fill:#1d2a23} .et{font:italic 11px sans-serif;fill:#3b4a42} .leyenda{font:11px sans-serif;fill:#3b4a42}</style>
<rect width="780" height="470" fill="#ffffff"/>
<path d="M 190.0 52.0 L 215.0 52.0" fill="none" stroke="#3b4a42" stroke-width="1.4"  marker-end="url(#f)"/>
<path d="M 385.0 52.0 L 410.0 52.0" fill="none" stroke="#3b4a42" stroke-width="1.4"  marker-end="url(#f)"/>
<text x="397.5" y="47.0" class="et" text-anchor="middle">sí</text>
<path d="M 580.0 52.0 L 605.0 52.0" fill="none" stroke="#3b4a42" stroke-width="1.4"  marker-end="url(#f)"/>
<path d="M 690.0 84.0 L 690.0 128.0" fill="none" stroke="#3b4a42" stroke-width="1.4"  marker-end="url(#f)"/>
<path d="M 300.0 84.0 L 300.0 128.0" fill="none" stroke="#3b4a42" stroke-width="1.4"  marker-end="url(#f)"/>
<text x="305.0" y="106.0" class="et" text-anchor="start">no</text>
<rect x="20" y="20" width="170" height="64" rx="6" fill="#eef5f0" stroke="#2e6b43" stroke-width="1.4" />
<text x="105.0" y="49.5" class="tx" text-anchor="middle">Revisa el panel de</text>
<text x="105.0" y="63.5" class="tx" text-anchor="middle">alertas por sede</text>
<polygon points="300.0,20 385,52.0 300.0,84 215,52.0" fill="#fff6e0" stroke="#9a6a00" stroke-width="1.4"/>
<text x="300.0" y="49.5" class="tx" text-anchor="middle">¿Alguna sede con</text>
<text x="300.0" y="63.5" class="tx" text-anchor="middle">alertas?</text>
<rect x="410" y="20" width="170" height="64" rx="6" fill="#eef5f0" stroke="#2e6b43" stroke-width="1.4" />
<text x="495.0" y="49.5" class="tx" text-anchor="middle">Abre la sede y el caso</text>
<text x="495.0" y="63.5" class="tx" text-anchor="middle">(sólo lectura)</text>
<rect x="605" y="20" width="170" height="64" rx="6" fill="#eef5f0" stroke="#2e6b43" stroke-width="1.4" />
<text x="690.0" y="49.5" class="tx" text-anchor="middle">Avisa a la Unidad</text>
<text x="690.0" y="63.5" class="tx" text-anchor="middle">Jurídica de la sede</text>
<rect x="605" y="128" width="170" height="64" rx="6" fill="#ffffff" stroke="#5b6b62" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="690.0" y="157.5" class="tx" text-anchor="middle">La Unidad Jurídica</text>
<text x="690.0" y="171.5" class="tx" text-anchor="middle">tramita el caso</text>
<rect x="215" y="128" width="170" height="64" rx="6" fill="#eef5f0" stroke="#2e6b43" stroke-width="1.4" />
<text x="300.0" y="157.5" class="tx" text-anchor="middle">Revisa reportes</text>
<text x="300.0" y="171.5" class="tx" text-anchor="middle">nacionales y bitácora</text>
<rect x="20" y="439" width="18" height="12" rx="3" fill="#eef5f0" stroke="#2e6b43" />
<text x="44" y="449" class="leyenda">Paso de este perfil</text>
<rect x="198.8" y="439" width="18" height="12" rx="3" fill="#ffffff" stroke="#5b6b62" stroke-dasharray="6 4"/>
