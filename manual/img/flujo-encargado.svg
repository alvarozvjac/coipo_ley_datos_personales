<polygon points="495.0,20 580,52.0 495.0,84 410,52.0" fill="#fff6e0" stroke="#9a6a00" stroke-width="1.4"/>
<text x="495.0" y="49.5" class="tx" text-anchor="middle">¿Identidad</text>
<text x="495.0" y="63.5" class="tx" text-anchor="middle">verificada?</text>
