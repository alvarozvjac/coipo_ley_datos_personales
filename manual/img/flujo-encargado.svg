<rect x="477.20000000000005" y="439" width="18" height="12" rx="3" fill="#e4e9e6" stroke="#4a5a50" />
<text x="501.20000000000005" y="449" class="leyenda">Cierre del caso</text>
<text x="20" y="466" class="leyenda">Los plazos internos y la prórroga los registra el Encargado (Administración del canal, en el mismo perfil).</text>
