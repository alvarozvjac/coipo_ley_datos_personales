<path d="M 580.0 376.0 L 605.0 376.0" fill="none" stroke="#3b4a42" stroke-width="1.4"  marker-end="url(#f)"/>
<text x="592.5" y="371.0" class="et" text-anchor="middle">no</text>
<rect x="20" y="20" width="170" height="64" rx="6" fill="#eef5f0" stroke="#2e6b43" stroke-width="1.4" />
<text x="105.0" y="42.5" class="tx" text-anchor="middle">Presenta la solicitud en</text>
<text x="105.0" y="56.5" class="tx" text-anchor="middle">el sitio público (Clave</text>
<text x="105.0" y="70.5" class="tx" text-anchor="middle">Única simulada)</text>
<rect x="215" y="20" width="170" height="64" rx="6" fill="#eef5f0" stroke="#2e6b43" stroke-width="1.4" />
<text x="300.0" y="49.5" class="tx" text-anchor="middle">Recibe el acuse con el</text>
<text x="300.0" y="63.5" class="tx" text-anchor="middle">número de caso</text>
<rect x="410" y="20" width="170" height="64" rx="6" fill="#eef5f0" stroke="#2e6b43" stroke-width="1.4" />
<text x="495.0" y="49.5" class="tx" text-anchor="middle">Sigue el estado en Mis</text>
<text x="495.0" y="63.5" class="tx" text-anchor="middle">solicitudes</text>
<polygon points="495.0,128 580,160.0 495.0,192 410,160.0" fill="#fff6e0" stroke="#9a6a00" stroke-width="1.4"/>
<text x="495.0" y="157.5" class="tx" text-anchor="middle">¿CONAF pide</text>
<text x="495.0" y="171.5" class="tx" text-anchor="middle">antecedentes?</text>
<rect x="215" y="128" width="170" height="64" rx="6" fill="#eef5f0" stroke="#2e6b43" stroke-width="1.4" />
<text x="300.0" y="157.5" class="tx" text-anchor="middle">Envía los antecedentes</text>
<text x="300.0" y="171.5" class="tx" text-anchor="middle">pedidos</text>
<rect x="410" y="236" width="170" height="64" rx="6" fill="#eef5f0" stroke="#2e6b43" stroke-width="1.4" />
<text x="495.0" y="265.5" class="tx" text-anchor="middle">Recibe la respuesta por</text>
<text x="495.0" y="279.5" class="tx" text-anchor="middle">correo, carta o retiro</text>
<polygon points="495.0,344 580,376.0 495.0,408 410,376.0" fill="#fff6e0" stroke="#9a6a00" stroke-width="1.4"/>
<text x="495.0" y="373.5" class="tx" text-anchor="middle">¿Acoge la</text>
<text x="495.0" y="387.5" class="tx" text-anchor="middle">solicitud?</text>
<rect x="215" y="344" width="170" height="64" rx="18" fill="#e4e9e6" stroke="#4a5a50" stroke-width="1.4" />
<text x="300.0" y="380.5" class="tx" text-anchor="middle">Caso cerrado</text>
<rect x="605" y="344" width="170" height="64" rx="6" fill="#eef5f0" stroke="#2e6b43" stroke-width="1.4" />
<text x="690.0" y="373.5" class="tx" text-anchor="middle">Reclama ante la Agencia</text>
<text x="690.0" y="387.5" class="tx" text-anchor="middle">(30 días hábiles)</text>
<rect x="20" y="439" width="18" height="12" rx="3" fill="#eef5f0" stroke="#2e6b43" />
<text x="44" y="449" class="leyenda">Paso de este perfil</text>
<rect x="198.8" y="439" width="18" height="12" rx="3" fill="#ffffff" stroke="#5b6b62" stroke-dasharray="6 4"/>
<text x="222.8" y="449" class="leyenda">Paso de otro perfil</text>
<polygon points="386.6,439 395.6,448 386.6,457 377.6,448" fill="#fff6e0" stroke="#9a6a00"/>
<text x="401.6" y="449" class="leyenda">Decisión</text>
<rect x="477.20000000000005" y="439" width="18" height="12" rx="3" fill="#e4e9e6" stroke="#4a5a50" />
<text x="501.20000000000005" y="449" class="leyenda">Cierre del caso</text>
<text x="20" y="466" class="leyenda">Ley 21.719, art. 14 ter y 11. El plazo legal y el reclamo se informan en el acuse y en la respuesta.</text>
